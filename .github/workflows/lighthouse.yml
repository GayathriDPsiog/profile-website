name: Lighthouse Audit

on:
  # Runs after every deployment finishes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  # Weekly check, every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  # Lets me start it by hand from the Actions tab
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Skip the audit if the deployment itself failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Wait for GitHub Pages to finish publishing
        run: sleep 30

      - name: Run Lighthouse on the live site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://gayathridpsiog.github.io/profile-website/
          uploadArtifacts: true